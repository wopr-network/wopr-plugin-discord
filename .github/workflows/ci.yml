name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (if script exists)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then
            echo "Running lint..."
            bun run lint
          else
            echo "No lint script found, skipping"
          fi

      - name: Typecheck (if script exists)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck ? 0 : 1)"; then
            echo "Running typecheck..."
            bun run typecheck
          else
            echo "No typecheck script, running tsc --noEmit"
            bunx tsc --noEmit
          fi

      - name: Build
        run: bun run build

      - name: Validate dist/
        run: |
          if [ ! -d dist/ ]; then
            echo "Error: dist/ directory not found after build"
            exit 1
          fi
          echo "dist/ directory exists with contents:"
          ls -la dist/

      - name: Test (if script exists)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            echo "Running tests..."
            bun run test
          else
            echo "No test script found, skipping"
          fi
